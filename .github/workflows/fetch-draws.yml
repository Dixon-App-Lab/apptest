name: Fetch real draw data (B1)

# Builds data/draws.json from lottoresults.co.nz and commits it.
#
# It commits rather than uploading an artifact because a session cannot
# download artifacts -- github.com is blocked by the same egress policy that
# blocks the site -- so committing is the only route that gets the dataset
# into the repo.
#
# Manual only. B2 may later put this on a schedule for Wed/Sat draws; that is
# a separate decision and deliberately not made here.

on:
  workflow_dispatch:
    inputs:
      months_back:
        description: 'How far back to collect, in month pages from newest. 180 = 15 years. 0 = the whole archive.'
        required: true
        default: '180'
      dry_run:
        description: 'Report findings without writing or committing anything.'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      debug_month:
        description: 'Optional: dump one month page as text and stop, e.g. /lotto/september-2022'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the dataset
        env:
          MONTHS_BACK: ${{ inputs.months_back }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG_MONTH: ${{ inputs.debug_month }}
        run: node tools/fetch-draws.mjs

      # Verify before committing: a dataset that breaks the app is worse than
      # no dataset, and the harness drives a real browser against it.
      - name: Verify against the new data
        if: inputs.dry_run == 'false' && inputs.debug_month == ''
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          npm run serve &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          npm run verify

      - name: Commit
        if: inputs.dry_run == 'false' && inputs.debug_month == ''
        run: |
          if git diff --quiet -- data/draws.json sw.js; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/draws.json sw.js
          git commit -m "Update the real NZ Lotto draw dataset

          Rebuilt by tools/fetch-draws.mjs via the Fetch real draw data
          workflow. meta records the window collected and how many draw
          numbers are missing inside it, so the dataset states its own
          coverage rather than implying it is complete.

          sw.js CACHE is bumped to match the last draw so phones do not keep
          serving the previous dataset from cache."
          git push
