name: Deploy to GitHub Pages

# The PWA needs an HTTPS origin before Android will offer to install it, and
# Pages is the shortest path to one. Requires Settings → Pages → Source set to
# "GitHub Actions" once, by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it — a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage the static site
        # Everything the browser needs, and nothing else — the generators and
        # the verification harness are development-only.
        run: |
          mkdir -p _site
          cp index.html styles.css app.js sw.js manifest.webmanifest _site/
          cp -r data icons _site/
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
