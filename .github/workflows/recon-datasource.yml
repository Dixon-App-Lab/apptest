name: Recon data source (D1)

# One-off survey of lottoresults.co.nz that settled D1. Findings go to the
# job log, not an artifact: a session cannot download artifacts (github.com is
# blocked by the same egress policy as the site) but it can read logs.
#
# Manual trigger only, on purpose. This is not a scraper and must not become
# one on a schedule -- automated collection is the decision D1 is still open
# on. Delete this workflow and tools/recon-datasource.mjs once D1 is settled.
#
# It exists as a workflow because a session cannot reach the site at all: the
# dev container's egress policy answers 403 to CONNECT. Runners have open
# network.

on:
  workflow_dispatch:

# Read-only. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Survey the site
        run: node tools/recon-datasource.mjs
